<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1d3a" />
  <title>Sem ligação — Garcia Pedro Teleka</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #121e31;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eaf2ff 0%, #ffffff 50%, #dbe9fe 100%);
    }
    .card { max-width: 380px; }
    .logo {
      width: 72px; height: 72px; border-radius: 18px; background: #0b1d3a; color: #fff;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
      font: 700 38px Georgia, "Times New Roman", serif;
    }
    h1 { font: 700 24px Georgia, serif; color: #0b1d3a; margin: 0 0 8px; }
    p { color: #5b6b82; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #0066ff; color: #fff; border: 0; border-radius: 999px;
      padding: 12px 28px; font-weight: 700; font-size: 15px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">G</div>
    <h1>Está sem ligação</h1>
    <p>Não foi possível carregar a página. Verifique a sua internet e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
